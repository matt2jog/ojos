name: Ojos

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  promotion:
    name: Verify promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.head_ref }}
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - run: test "$SOURCE_BRANCH" = dev && test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY"

  backend:
    name: Verify backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agentic_system/assistant/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install -r agentic_system/assistant/requirements.txt
      - run: python -m unittest discover -s agentic_system/assistant -t . -v
      - run: node --test agentic_system/capture/recorder.test.cjs models/vision/*.test.mjs

  desktop:
    name: Verify desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:dev
      - run: test -n "$(find out/renderer/assets -name 'VisionDebug-*.js' -print -quit)"
      - run: npm run build
      - run: test -z "$(find out/renderer/assets -name 'VisionDebug-*' -print -quit)"

  deploy:
    name: Deploy Cloud Run
    if: github.event_name == 'push'
    needs: [backend, desktop]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    concurrency:
      group: cloud-run-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ojos-matt2jog
      REGION: us-east1
      SCOPE: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/472273737799/locations/global/workloadIdentityPools/github/providers/github
          service_account: ojos-${{ env.SCOPE }}-deploy@ojos-matt2jog.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and publish
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          IMAGE="$REGION-docker.pkg.dev/$PROJECT/ojos-$SCOPE/assistant:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"
          printf 'IMAGE=%s\n' "$IMAGE" >> "$GITHUB_ENV"
      - name: Update service
        run: |
          max_instances=2
          if [ "$SCOPE" = prod ]; then max_instances=3; fi
          gcloud run deploy "ojos-$SCOPE" --project "$PROJECT" --region "$REGION" --quiet \
            --image "$IMAGE" --service-account "ojos-$SCOPE-runtime@$PROJECT.iam.gserviceaccount.com" \
            --execution-environment gen2 --cpu 2 --memory 1Gi --timeout 180s --concurrency 4 \
            --min 0 --min-instances 0 --max-instances "$max_instances" \
            --set-env-vars 'OJOS_GEMINI_KEY_FILE=/var/run/secrets/ojos-gemini/key' \
            --set-secrets "OJOS_CLOUD_TOKEN=ojos-$SCOPE-token:1,/var/run/secrets/ojos-gemini/key=ojos-gemini-key:latest" \
            --startup-probe 'httpGet.path=/healthz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=3,failureThreshold=12'
      - name: Verify deployment
        run: |
          url=$(gcloud run services describe "ojos-$SCOPE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          curl --fail --silent --show-error --retry 5 "$url/healthz" | jq -e '.status == "ok"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$url/v1/analyze")" = 401
